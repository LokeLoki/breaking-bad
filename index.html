<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🐴 SAY MY NAME</title>
<style>
  :root{ --accent:#7fae6a; --paper:#e9e2d0; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
  #stage{position:relative;display:inline-block}
  #film{display:block;width:min(100vw,177.78vh);height:auto;background:#000}
  .overlay{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;opacity:1;transition:opacity .6s}
  .overlay.hidden{opacity:0;pointer-events:none}
  #start h1{font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;
    font-size:clamp(40px,7vw,96px);letter-spacing:.22em;color:var(--paper);font-weight:400;text-indent:.22em}
  #start .sub{color:#8a8374;font-size:14px;letter-spacing:.3em;text-transform:uppercase}
  #start .rule{width:120px;height:2px;background:var(--accent)}
  button{background:none;border:1px solid #3a3a33;color:var(--paper);padding:14px 44px;
    font-size:15px;letter-spacing:.35em;cursor:pointer;transition:all .25s;text-indent:.35em}
  button:hover{border-color:var(--accent);color:var(--accent)}
  .hint{color:#55503f;font-size:11px;letter-spacing:.2em}
  #replay h2{font-family:Impact,'Arial Narrow Bold',sans-serif;font-size:clamp(28px,4.5vw,60px);
    letter-spacing:.3em;color:#a8c98a;font-weight:400;text-indent:.3em}
  #replay .sub{color:#6e6a5c;font-size:12px;letter-spacing:.35em;text-transform:uppercase}
  #tc{position:absolute;right:14px;bottom:10px;font-family:Consolas,monospace;font-size:12px;
    color:#cfc9b8;opacity:.55;letter-spacing:.1em;display:none}
  #prog{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent);opacity:.7;display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="film" width="1920" height="1080"></canvas>
  <div id="start" class="overlay">
    <h1>SAY MY NAME</h1>
    <div class="rule"></div>
    <p class="sub">a cinematic showcase &middot; 66 seconds</p>
    <button id="begin">&#9654;&nbsp; PLAY</button>
    <p class="hint">sound on &middot; headphones recommended &middot; ESC stops</p>
  </div>
  <div id="replay" class="overlay hidden">
    <h2>SAY MY NAME</h2>
    <p class="sub">cinematic showcase</p>
    <button id="again">&#8635;&nbsp; WATCH AGAIN</button>
  </div>
  <div id="tc">00:00</div>
  <div id="prog"></div>
</div>
<script>
'use strict';
/* ============ CONFIG ============ */
const W=1920,H=1080,DUR=66;
const canvas=document.getElementById('film'), ctx=canvas.getContext('2d');
const $tc=document.getElementById('tc'), $prog=document.getElementById('prog');
const $start=document.getElementById('start'), $replay=document.getElementById('replay');
window.__errs=[]; window.addEventListener('error',e=>window.__errs.push(String(e.message)));
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const qs=new URLSearchParams(location.search);
const SEEK=qs.has('t')?parseFloat(qs.get('t')):null;
const STILL=qs.has('still');
const MUTED=qs.has('muted')||(SEEK!==null);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3)};
const easeio=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function off(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

/* ============ AUDIO (all synthesized) ============ */
const S={ctx:null,master:null,windG:null,droneG:null,noise:null,ev:0,bub:{next:0},tick:{next:0},riser:null,lastWind:-1,mu:0};
function audioInit(){
  if(S.ctx) return;
  try{
    const C=new (window.AudioContext||window.webkitAudioContext)();
    S.ctx=C;
    S.master=C.createGain(); S.master.gain.value=0; S.master.connect(C.destination);
    const nb=C.createBuffer(1,C.sampleRate*2,C.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; S.noise=nb;
    // drone: two detuned saws through lowpass
    const d1=C.createOscillator(),d2=C.createOscillator(),dg=C.createGain(),df=C.createBiquadFilter();
    d1.type='sawtooth';d2.type='sawtooth';d1.frequency.value=54;d2.frequency.value=55.8;
    df.type='lowpass';df.frequency.value=130;dg.gain.value=0.0;
    d1.connect(df);d2.connect(df);df.connect(dg);dg.connect(S.master);d1.start();d2.start();
    S.droneG=dg;
    // wind: looped noise through wandering bandpass
    const ws=C.createBufferSource();ws.buffer=nb;ws.loop=true;
    const wf=C.createBiquadFilter();wf.type='bandpass';wf.frequency.value=430;wf.Q.value=.4;
    const wg=C.createGain();wg.gain.value=0;
    const lfo=C.createOscillator(),lg=C.createGain();lfo.frequency.value=.11;lg.gain.value=140;
    lfo.connect(lg);lg.connect(wf.frequency);lfo.start();
    ws.connect(wf);wf.connect(wg);wg.connect(S.master);ws.start();
    S.windG=wg;
    // guitar bus + canyon echo (feedback delay -> lowpass -> back into delay)
    S.gtr=C.createGain(); S.gtr.gain.value=1; S.gtr.connect(S.master);
    S.dly=C.createDelay(1.0); S.dly.delayTime.value=.27;
    S.fbk=C.createGain(); S.fbk.gain.value=.42;
    S.dlp=C.createBiquadFilter(); S.dlp.type='lowpass'; S.dlp.frequency.value=2500;
    S.wet=C.createGain(); S.wet.gain.value=.45;
    S.gtr.connect(S.dly); S.dly.connect(S.dlp); S.dlp.connect(S.fbk); S.fbk.connect(S.dly);
    S.dlp.connect(S.wet); S.wet.connect(S.master);
  }catch(e){window.__errs.push('audio:'+e.message)}
}
function env(g,t0,vol,att,dur){ // helper envelope
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+att);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+att+dur);
}
function blip(freq,dur,vol,type){ if(!S.ctx)return;
  const C=S.ctx,o=C.createOscillator(),g=C.createGain(),t=C.currentTime;
  o.type=type||'sine';o.frequency.value=freq;
  o.connect(g);g.connect(S.master);env(g,t,vol,0.005,dur);o.start(t);o.stop(t+att0(dur));
}
function att0(d){return d+0.05}
function thump(vol,f0,f1,dur){ if(!S.ctx)return;
  const C=S.ctx,o=C.createOscillator(),g=C.createGain(),t=C.currentTime;
  o.type='sine';o.frequency.setValueAtTime(f0||52,t);o.frequency.exponentialRampToValueAtTime(f1||36,t+(dur||.4));
  o.connect(g);g.connect(S.master);env(g,t,vol,0.008,dur||.4);o.start(t);o.stop(t+(dur||.4)+.1);
}
function noiseBurst(vol,cut,dur){ if(!S.ctx)return;
  const C=S.ctx,s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain(),t=C.currentTime;
  s.buffer=S.noise;f.type='lowpass';f.frequency.value=cut;
  s.connect(f);f.connect(g);g.connect(S.master);env(g,t,vol,0.01,dur);s.start(t);s.stop(t+dur+.1);
}
function tickSound(){ blip(1150,.028,.09,'square') }
function bubbleSound(){ blip(260+Math.random()*420,.06,.045,'sine') }
function impactSound(){ thump(1,88,28,.9); noiseBurst(.62,900,.65);
  setTimeout(()=>thump(.5,58,26,.8),140); setTimeout(()=>thump(.3,44,20,1.15),430); }
function ringSound(){ if(!S.ctx)return;
  const C=S.ctx,o=C.createOscillator(),g=C.createGain(),t=C.currentTime;
  o.type='sine';o.frequency.value=2350;o.connect(g);g.connect(S.master);
  g.gain.setValueAtTime(.11,t);g.gain.exponentialRampToValueAtTime(.0001,t+4.2);
  o.start(t);o.stop(t+4.4);
}
function padSound(){ if(!S.ctx)return;
  const C=S.ctx,o=C.createOscillator(),g=C.createGain(),t=C.currentTime;
  o.type='sine';o.frequency.value=65;o.connect(g);g.connect(S.master);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+3);
  g.gain.setValueAtTime(.13,t+5.5);g.gain.exponentialRampToValueAtTime(.0001,t+8.5);
  o.start(t);o.stop(t+8.7);
}
function riserStart(){ if(!S.ctx)return;
  const C=S.ctx,s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain(),t=C.currentTime;
  s.buffer=S.noise;s.loop=true;f.type='highpass';f.frequency.setValueAtTime(300,t);
  f.frequency.exponentialRampToValueAtTime(3800,t+9.5);
  s.connect(f);f.connect(g);g.connect(S.master);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.24,t+9.4);
  s.start(t);s.stop(t+9.8);
  const o=C.createOscillator(),g2=C.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(85,t);o.frequency.exponentialRampToValueAtTime(640,t+9.5);
  o.connect(g2);g2.connect(S.master);
  g2.gain.setValueAtTime(.0001,t);g2.gain.exponentialRampToValueAtTime(.1,t+9.4);
  o.start(t);o.stop(t+9.8); S.riser={s,o,g,g2};
}
function riserStop(){ if(!S.riser)return;
  try{S.riser.g.gain.cancelScheduledValues(S.ctx.currentTime);S.riser.g.gain.setTargetAtTime(0,S.ctx.currentTime,.05);
      S.riser.s.stop();S.riser.o.stop()}catch(e){} S.riser=null;
}
function whooshSound(){ if(!S.ctx)return;
  const C=S.ctx,s=C.createBufferSource(),f=C.createBiquadFilter(),g=C.createGain(),t=C.currentTime;
  s.buffer=S.noise;s.loop=true;f.type='bandpass';f.Q.value=.8;
  f.frequency.setValueAtTime(240,t);f.frequency.exponentialRampToValueAtTime(2600,t+.28);
  f.frequency.exponentialRampToValueAtTime(180,t+.62);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.22);
  g.gain.exponentialRampToValueAtTime(.0001,t+.72);
  s.connect(f);f.connect(g);g.connect(S.master);s.start(t);s.stop(t+.8);
}
/* ---- spaghetti-western score: Karplus-Strong plucked guitar + echo + whistle ---- */
function m2f(m){return 440*Math.pow(2,(m-69)/12)}
const KSC={};
function ksBuf(m){ if(KSC[m])return KSC[m];
  const C=S.ctx,sr=C.sampleRate,f=m2f(m),n=Math.max(2,Math.round(sr/f)),len=Math.round(sr*3.0);
  const b=C.createBuffer(1,len,sr),d=b.getChannelData(0),dl=new Float32Array(n);
  for(let i=0;i<n;i++)dl[i]=Math.random()*2-1;
  let prev=0;for(let i=0;i<n;i++){const v=dl[i];dl[i]=(v+prev)*.5;prev=v} // soften the pick
  const k=.35,damp=.996; let lp=0;
  for(let i=0;i<len;i++){const a=dl[i%n],c=dl[(i+1)%n];
    lp=lp*(1-k)+(a+c)*.5*k*damp; dl[i%n]=lp; d[i]=lp}
  for(let i=0;i<len;i++)d[i]*=Math.exp(-i/(sr*1.15));
  KSC[m]=b;return b}
function pluck(m,vol,when,dur){ if(!S.ctx||!S.gtr)return;
  const C=S.ctx,t=when||C.currentTime,src=C.createBufferSource();
  src.buffer=ksBuf(m);
  const bp=C.createBiquadFilter();bp.type='peaking';bp.frequency.value=Math.max(90,Math.min(1600,m2f(m)*2.1));bp.Q.value=1.1;bp.gain.value=5;
  const g=C.createGain();env(g,t,vol,.005,dur||1.6);
  src.connect(bp);bp.connect(g);g.connect(S.gtr);
  src.start(t);src.stop(t+(dur||1.6)+.1)}
function pluckG(m,vol,when,dur,key){ // KS string + playbackRate keyframes = real slide (like slide off a fret)
  if(!S.ctx||!S.gtr)return;
  const C=S.ctx,t=when,src=C.createBufferSource();src.buffer=ksBuf(m);
  const bp=C.createBiquadFilter();bp.type='peaking';bp.frequency.value=Math.max(90,Math.min(1600,m2f(m)*2.1));bp.Q.value=1.1;bp.gain.value=5;
  const g=C.createGain();env(g,t,vol,.005,dur);
  src.playbackRate.setValueAtTime(m2f(key[0][1])/m2f(m),t);
  for(const[dt,mm]of key)if(dt>0)src.playbackRate.linearRampToValueAtTime(m2f(mm)/m2f(m),t+dt);
  src.connect(bp);bp.connect(g);g.connect(S.gtr);
  src.start(t);src.stop(t+dur+.1)}
/* bowed-string voice: detuned ensemble + DELAYED vibrato + body formants + bow noise + scoop.
   (the flute tell was sine+instant vibrato; real strings bite in, then vibrato blooms) */
function sw(m,when,dur,vol,reg){ // reg: 'cello'|'viola'|'violin'
  if(!S.ctx)return; const C=S.ctx,t=when,f=m2f(m);
  const cfg=({cello:{n:3,lp:1150,f1:240,f2:620,vib:16,vt:.55,det:5,att:.5},
             viola:{n:3,lp:1750,f1:300,f2:900,vib:20,vt:.5,det:6,att:.4},
             violin:{n:4,lp:2600,f1:360,f2:1150,vib:26,vt:.45,det:7,att:.32}})[reg||'violin'];
  const body=C.createGain();body.gain.value=1;
  const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cfg.lp;lp.Q.value=.6;
  const q1=C.createBiquadFilter();q1.type='peaking';q1.frequency.value=cfg.f1;q1.Q.value=1.4;q1.gain.value=6;
  const q2=C.createBiquadFilter();q2.type='peaking';q2.frequency.value=cfg.f2;q2.Q.value=1.6;q2.gain.value=4.5;
  lp.connect(q1);q1.connect(q2);q2.connect(body);
  // vibrato bus (depth ramps in AFTER the note -> string, not flute)
  const lfo=C.createOscillator();lfo.type='sine';lfo.frequency.value=5.3;
  const dep=C.createGain();dep.gain.setValueAtTime(0,t);
  dep.gain.setValueAtTime(0,t+cfg.vt);dep.gain.linearRampToValueAtTime(cfg.vib,t+cfg.vt+.7);
  lfo.connect(dep);
  for(let i=0;i<cfg.n;i++){
    const o=C.createOscillator();o.type='sawtooth';o.frequency.value=f;
    // attack scoop/portamento up into the note
    o.detune.setValueAtTime(-cfg.det*1.4,t);o.detune.linearRampToValueAtTime(0,t+.13);
    dep.connect(o.detune);
    const og=C.createGain();og.gain.value=(i%2?-.42:.42); // out-of-phase mix thins the chorus beat nicely
    o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur+.2)}
  // bow noise: breath at the attack, then a faint sustained rasp
  const bn=C.createBufferSource();bn.buffer=S.noise;bn.loop=true;
  const bhp=C.createBiquadFilter();bhp.type='bandpass';bhp.frequency.value=Math.min(6500,f*4+900);bhp.Q.value=.7;
  const bng=C.createGain();bng.gain.setValueAtTime(.0001,t);
  bng.gain.exponentialRampToValueAtTime(vol*.12,t+.05);bng.gain.exponentialRampToValueAtTime(.0001,t+Math.min(dur,.9));
  bn.connect(bhp);bhp.connect(bng);bng.connect(body);bn.start(t);bn.stop(t+dur+.2);
  // amp envelope: slow bite attack, sustain, long release
  const g=C.createGain();g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+cfg.att);
  g.gain.setValueAtTime(vol,t+Math.max(cfg.att+.2,dur*.72));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  body.connect(g);g.connect(S.master);
  lfo.start(t);lfo.stop(t+dur+.2);
}
// 3-layer chamber string section: cello root, viola thirds-below, violin lead
function sectionMel(t0,mel,vol,reg){for(const[bt,m,du]of mel)sw(m,t0+bt*BT,du*BT+.35,vol,reg)}
// scene cues: each schedules its whole phrase on the audio clock (tight rhythm, seek-safe)
function cueTitle(){ // main-title intro riff, Drop D slide - tab-verified (guitaretab/azchords)
  if(!S.ctx)return; const t0=S.ctx.currentTime+.05;
  // 1: open D rings (d:0)  2: slide A+D strings 5->7 hold ->release to open  3: 3->5->open
  pluck(38,.42,t0+0.0,2.6);                                   // d: open D
  pluckG(45,.34,t0+1.05,2.4,[[0,50],[.42,52],[.95,50],[1.35,45]]);  // a: 5s7~s0 (D3->E3 slide+release)
  pluckG(38,.38,t0+1.05,2.4,[[0,43],[.42,45],[.95,43],[1.35,38]]);  // d: 5s7~s0 (G2->A2 slide+release)
  pluckG(45,.30,t0+3.3,2.0,[[0,49],[.4,50],[.9,45]]);         // a: 3s5s0
  pluckG(38,.34,t0+3.3,2.0,[[0,41],[.4,43],[.9,38]]);         // d: 3s5s0
  pluck(38,.4,t0+5.2,1.4);pluck(45,.3,t0+5.2,1.4);            // open D+A ring
  pluckG(57,.26,t0+6.1,1.8,[[0,57],[.4,58],[.95,55]]);        // g: 2s3s0 A3->Bb3->open G3 (fade into desert)
}
function cueDesert(){ // sparse Dm desert ambience under the push-in
  if(!S.ctx)return; const t0=S.ctx.currentTime+.03;
  const ch=[[38,50,57,53],[38,50,57,55],[41,53,60,57],[38,50,57,53]],st=[0,2.6,5.2,7.4];
  for(let c=0;c<4;c++){pluck(ch[c][0],.3,t0+st[c],2.4);
    for(let i=1;i<4;i++)pluck(ch[c][i],.16,t0+st[c]+i*.6,2.2)}}
function cueLab(){ if(!S.ctx)return; const t0=S.ctx.currentTime+.03;
  for(const[d,m,v]of[[0,38,.36],[1.7,38,.26],[3.4,39,.3],[4.9,38,.26],[6.4,45,.2],[7.0,46,.18],[8.3,39,.24],[9.0,38,.3],[10.5,38,.22]])pluck(m,v,t0+d,1.6)}
// Heisenberg's Theme ('The Long Walk Alone', Dave Porter): 78 BPM, G minor (Camelot 6A).
// In the actual S5E7 teaser the cue plays over the DRIVE and FADES OUT on arrival; the
// dialogue then runs over ambience only. Cue structure below mirrors that.
const BT=0.7692; // beat at 78 BPM
function lwaBed(t0,fadeAt){ // sparse guitar: Gm | Eb | Cm | D  (one bar each)
  const bars=[[43,50,58,55],[39,51,55,58],[48,55,60,55],[50,57,53,57]];
  for(let b=0;b<4;b++){const tb=t0+b*4*BT, sc=fadeAt?(fadeAt-(tb-t0)):99;
    const v=(sc<=0)?.0:(.30*(1-Math.max(0,Math.min(1,(tb+4*BT-t0-fadeAt))/1.6)));
    if(v<=.001)continue;
    pluck(bars[b][0],v*.85,tb,2.0);
    for(let i=1;i<4;i++)pluck(bars[b][i],v*.45,tb+i*BT,1.6)}}
// lament melody + viola third-below harmony (G natural minor: G A Bb C D Eb F)
const LAMENT=[[0,62,2.1],[3,58,.9],[4,60,1.1],[5.4,58,1.4],[7,55,2.6],[9.6,53,1.2],[10.9,55,1.0],[12.6,58,3.2]];
// diatonic third-below in G minor, kept in viola register (D5->Bb4, Bb4->G4, etc.)
const HARM=[[0,53,2.1],[3,50,.9],[4,51,1.1],[5.4,50,1.4],[7,48,2.6],[9.6,46,1.2],[10.9,48,1.0],[12.6,50,3.2]];
function cueChase(){ if(!S.ctx)return; const t0=S.ctx.currentTime+.03;
  lwaBed(t0,5.6);                                  // guitar bed, fades on arrival
  sectionMel(t0,LAMENT.slice(0,5),.13,'violin');   // theme enters over the drive
  sectionMel(t0,HARM.slice(0,5),.09,'viola');
  sw(43,t0,3.4*BT,.10,'cello');                    // low G drone under bars 1-2
  for(const d of [5.6]) sw(39,t0+d*BT,2.4*BT,.09,'cello');  // Eb under bar 3
  pluck(43,.26,t0+7.2,1.2)}                        // last low G as they pull up
function cueEnd(){ // end card: full Heisenberg-theme reprise on a real string section
  if(!S.ctx)return; const t0=S.ctx.currentTime+.03;
  lwaBed(t0,0);                                    // guitar stays underneath
  sw(31,t0,13.2*BT,.09,'cello');                   // sub G1 pedal
  sw(43,t0,13.2*BT,.10,'cello');                   // G2 drone
  sw(50,t0+4*BT,9.2*BT,.06,'cello');               // D3 lift
  sectionMel(t0,HARM,.085,'viola');                // third-below harmony line
  sectionMel(t0,LAMENT,.155,'violin');             // lead
  for(const bt of [0,4,8,12])sw(50,t0+bt*BT,3.4*BT,.05,'viola'); // sustained D inner pulse
}
const CUES=[{t:0.35,f:cueTitle},{t:7.6,f:cueDesert},{t:17.05,f:cueLab},{t:29.05,f:cueChase},{t:58.0,f:cueEnd}];
// scheduled one-shot events (deterministic; seek-safe via pointer)
const EVENTS=[
  {t:17.0,f:()=>thump(.4,62,36,.32)},{t:29.0,f:()=>thump(.32,60,38,.3)},
  {t:36.2,f:whooshSound},{t:37.0,f:()=>thump(.45,55,32,.35)},
  {t:39.0,f:()=>thump(.30,50,40,.3)},{t:43.0,f:()=>thump(.45,52,36,.35)},

function drawFig(g,x,y,h,t,dir,hat,col,armFwd){
  g.save();g.translate(x,y);g.scale(dir,1);g.fillStyle=col;
  const sw=REDUCED?0:Math.sin(t*1.7+x)*1.5*(1+GUST), bd=(Math.sin(t*.8)+1)/2;

  g.moveTo(h*.032,0);g.lineTo(h*.098,0);g.lineTo(h*.08,-h*.42);g.lineTo(h*.026,-h*.42);g.closePath();g.fill();
  // coat: shoulders to flared hem, wind sway
  const sh=-h*.78,hem=-h*.02;
  g.beginPath();
  g.moveTo(-h*.14,sh);
  g.bezierCurveTo(-h*.175,sh+h*.2,-h*.175+sw,hem,-h*.15+sw,hem);
  g.lineTo(h*.15,hem);
  g.bezierCurveTo(h*.175,hem-h*.12,h*.145,sh+h*.2,h*.14,sh);
  g.closePath();g.fill();
  // neck + head (+breathing bob)
  const hy=sh-h*.05-bd*h*.005;

  g.beginPath();g.arc(h*.005,hy-h*.042,h*.049,0,7);g.fill();
  if(hat){ // pork-pie silhouette
    g.beginPath();g.ellipse(h*.005,hy-h*.062,h*.094,h*.02,0,0,7);g.fill();
    g.beginPath();g.moveTo(h*.005-h*.056,hy-h*.062);g.lineTo(h*.005-h*.044,hy-h*.158);
    g.lineTo(h*.005+h*.048,hy-h*.158);g.lineTo(h*.005+h*.058,hy-h*.062);g.closePath();g.fill();
  }
  // hanging arm
  g.strokeStyle=col;g.lineWidth=h*.05;g.lineCap='round';
  g.beginPath();g.moveTo(h*.095,sh+h*.015);
  g.quadraticCurveTo(h*.15,sh+h*.16,h*.125+sw*.5,hem+h*.03);g.stroke();

}

  ctx.beginPath();ctx.ellipse(x,y-26*s,120*s,34*s,0,0,7);ctx.fill();
  ctx.globalCompositeOperation='lighter';
  const passBlow=p>.72?clamp((p-.72)/.12,0,1):0;
  for(const dx of[-42,42]){
    const lx=x+dx*s;
    const R=Math.min((90+150*passBlow)*s,560);
    const coreA=.95-.35*passBlow;
    const gr=ctx.createRadialGradient(lx,y-8*s,2,lx,y-8*s,R);
    gr.addColorStop(0,`rgba(255,246,215,${coreA})`);gr.addColorStop(.25,`rgba(255,240,200,${.4+.2*passBlow})`);gr.addColorStop(1,'rgba(255,240,200,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(lx,y-8*s,R,0,7);ctx.fill();
    // beam cones toward camera
    ctx.fillStyle='rgba(255,244,205,.08)';
    ctx.beginPath();ctx.moveTo(lx,y-8*s);ctx.lineTo(lx-60*s,y+220*s);ctx.lineTo(lx+60*s,y+220*s);ctx.closePath();ctx.fill();
  }
  // the moment of passage: horizontal streak smear
  if(p>.75&&p<.92){const k=clamp((p-.75)/.06,0,1)*clamp((.92-p)/.08,0,1);
    ctx.fillStyle=`rgba(255,238,196,${.18*k})`;ctx.fillRect(-W*.4,y-70*s,W*2.4,120*s)}
  ctx.globalCompositeOperation='source-over';
  } // carVisible
  // kicked dust
  if(P.length===0||P[0].k!=='hd')seedParticles(30,()=>({k:'hd',x:x+(Math.random()-.5)*160*s,y:y+(Math.random()-.5)*20,
    vx:p>.72?-(160+Math.random()*320):-(60+Math.random()*80),vy:(Math.random()-.5)*30,life:.6+Math.random()*1.1}));
  ctx.fillStyle='rgba(200,180,140,.20)';
  drawParticles(ctx,(g,p)=>{g.globalAlpha=clamp(p.life,0,.25);g.beginPath();g.arc(p.x,p.y,2+Math.random()*2,0,7);g.fill()});
  stepParticles(1/60);
}
// S4 — the standoff
function scene4(p,tg){
  const T=37+19*p;
  // camera punches on the dialogue beats + slight reframe per line
  let punch=0,ox=0;
  // A = HATTED = Heisenberg (left, x=.335W); B = unhatted (right, x=.60W). ox shifts cam center to key the speaker.
  // centering A needs ox≈-259, centering B needs ox≈+250 (relative to the midway base .47W).
  if(T>=39&&T<40.8){const q=(T-39)/1.8;punch=.05*Math.sin(q*Math.PI);ox=-150*Math.sin(q*Math.PI)}    // "You know who I am" (A): favor Heisenberg
  if(T>=43&&T<44.4){const q=(T-43)/1.4;const s=Math.sin(q*Math.PI);punch=.11*s;ox=-210*s}            // "Say my name" (A): push in on HEISENBERG
  if(T>=47.5&&T<49){const q=(T-47.5)/1.5;const s=Math.sin(q*Math.PI);punch=.04*s;ox=180*s}           // "...You're Heisenberg" (B): reaction shot, key on B
  if(T>=51.6){const q=clamp((T-51.6)/1.4,0,1);punch=.16*q;ox=-230*q}                                 // "goddamn right" (A): hold tight on HEISENBERG + gun
  const z=(1+1.0*Math.pow(ease(p),1.15))*(1+punch);
  const feet=H*.87;
  const cx=W*.47+ox,cy=H*(.62+.03*p);
  applyCam(z,cx,cy);
  // gusts whip the dust as tension rises
  GUST=REDUCED?0:Math.max(0,(Math.sin(TG*.9)+Math.sin(TG*2.3+1)*.5)*.5)*(.5+.9*clamp((T-40)/14,0,1));
  ctx.drawImage(standC,-100,-100,W+200,H+200);
  // figures: rim on inner (sun-facing) edge then black
  const A={x:W*.335,dir:1,hat:true,h:440},B={x:W*.60,dir:-1,hat:false,h:412};
  const drawT=clamp((T-51.6)/.5,0,1);          // pistol up at 'You're goddamn right'
  const tilt=drawT>0? Math.sin(Math.min(1,(T-51.6)/.5)*Math.PI)*0.03 : 0;
  for(const F of [A,B])for(const col of ['#d96a35','#0b0908']){
    const off=col==='#d96a35'?F.dir*3.5:0;
    ctx.save();
    if(F===A&&drawT>0){ctx.translate(F.x+off,feet);ctx.rotate(-tilt*F.dir);ctx.translate(-(F.x+off),-feet)}
    drawFig(ctx,F.x+off,feet,F.h,tg,F.dir,F.hat,col,(F===A&&drawT>0)?drawT:0);
    if(F===A&&drawT>0){ // pistol in the raised hand
      ctx.save();ctx.translate(F.x,feet);ctx.scale(F.dir,1);
      const hy=-F.h*.78+F.h*.12, hx=F.h*.335;
      ctx.fillStyle=col;ctx.fillRect(hx,hy,F.h*.085,F.h*.022);ctx.fillRect(hx+F.h*.055,hy+F.h*.02,F.h*.02,F.h*.035);
      ctx.restore();}
    ctx.restore();}
  // hard wind: streaming dust
  if(P.length===0||P[0].k!=='wind')seedParticles(70,()=>({k:'wind',x:Math.random()*W,y:H*(.55+Math.random()*.35),
    vx:(180+Math.random()*260)*(1+GUST),vy:(Math.random()-.5)*20,life:.4+Math.random()*.8}));
  ctx.strokeStyle='rgba(255,196,130,.35)';ctx.lineWidth=1.2;
  drawParticles(ctx,(g,p)=>{g.globalAlpha=clamp(p.life*1.2,0,.4);
    g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-26,p.y-p.vy*.06);g.stroke()});
  stepParticles(1/60);
}
// S5 — aftermath + title
function scene5(tl,tg){
  const zz=REDUCED?1:1+.07*clamp(tl/8.5,0,1); // slow push-in on the end card
  ctx.setTransform(zz,0,0,zz,W/2-W/2*zz,H/2-H*.5*zz);
  ctx.fillStyle='#000';ctx.fillRect(-W,-H,W*3,H*3);
  // rain of cooling embers right after the blast, then slow dust motes
  if(tl<3.2){
    if(!P.length||P[0].k!=='emb')seedParticles(46,()=>{const an=Math.random()*6.283,sp=140+Math.random()*560;
      return{k:'emb',x:W*.5+Math.cos(an)*34,y:H*.6+Math.sin(an)*34,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-190,g:1,life:.6+Math.random()*1.9,s:1.2+Math.random()*2.6}});
    ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,170,80,1)';
    drawParticles(ctx,(g,p)=>{g.globalAlpha=clamp(p.life,0,1)*.85;g.beginPath();g.arc(p.x,p.y,p.s,0,7);g.fill()});
    ctx.globalCompositeOperation='source-over';
  }else{
    if(!P.length||P[0].k!=='mote')seedParticles(26,()=>({k:'mote',x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*10,life:4+Math.random()*6}));
    ctx.fillStyle='rgba(200,190,160,.5)';
    drawParticles(ctx,(g,p)=>{g.globalAlpha=clamp(p.life/6,0,.2);g.beginPath();g.arc(p.x,p.y,1.1,0,7);g.fill()});
  }
  stepParticles(1/60);ctx.globalAlpha=1;
  const ta=clamp((tl-2)/1.6,0,1); // title in at 58s
  if(ta>0){ctx.globalAlpha=ta;
    textOn(ctx,'SAY MY NAME',W/2,H*.5,'400 150px Impact, Haettenschweiler, sans-serif','#a8c98a','30px'); // pushed by cam
    ctx.globalAlpha=1;}
}
// captions
const CAPS=[
  [19.0,22.0,'The chemistry is exact.'],
  [39.0,41.5,'You know who I am.'],
  [43.0,45.5,'Say my name.'],
  [47.5,50.0,'…You\u2019re Heisenberg.'],
  [51.5,55.3,'You\u2019re goddamn right.'],
];
function drawCaptions(t){
  ctx.setTransform(1,0,0,1,0,0);
  for(const[a,b,txt]of CAPS){
    if(t<a||t>b)continue;
    const al=Math.min(1,(t-a)/.35,(b-t)/.35);
    ctx.globalAlpha=clamp(al,0,1);
    textOn(ctx,txt,W/2,H-150,'300 34px system-ui','#f2ead9','3px');
    ctx.globalAlpha=1;
  }
}

/* ============ TIMELINE ============ */
function draw(t){
  shake(t);
  if(t<7)scene0(t/7,0)?0:scene0(t); // (scene0 ignores 2nd arg)
  else if(t<17)scene1((t-7)/10,t);
  else if(t<29)scene2((t-17)/12,t);
  else if(t<37)scene3((t-29)/8,t);
  else if(t<55.68)scene4((t-37)/19,t);
  else scene5(t-56,t);
  // 1-frame flash accents on the hard cuts (classic film-leader punch)
  if(!REDUCED){
    if(t>=7&&t<7.07){ctx.fillStyle='rgba(255,244,214,.30)';ctx.fillRect(0,0,W,H)}
    if(t>=17&&t<17.07){ctx.fillStyle='rgba(120,235,200,.26)';ctx.fillRect(0,0,W,H)}
    if(t>=29&&t<29.07){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H)}
    if(t>=37&&t<37.08){ctx.fillStyle='rgba(255,180,110,.4)';ctx.fillRect(0,0,W,H)}
  }
  // impact flash / hard cut
  ctx.setTransform(1,0,0,1,0,0);
  if(t>=55.5&&t<55.82){ctx.fillStyle='#fff';ctx.globalAlpha=clamp(1-(t-55.5)/.32,0,1);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  else if(t>=55.82&&t<56){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H)}
  if(t>=55.58&&t<57.3){ // blast: core fireball + triple shockwave rings
    const bcx=W*.5,bcy=H*.6;
    ctx.save();ctx.globalCompositeOperation='lighter';
    if(t<56.25){const q=(t-55.58)/.67;
      const gr=ctx.createRadialGradient(bcx,bcy,10,bcx,bcy,220+760*q);
      gr.addColorStop(0,`rgba(255,232,170,${.55*(1-q)})`);gr.addColorStop(.5,`rgba(255,150,60,${.25*(1-q)})`);gr.addColorStop(1,'rgba(255,120,40,0)');
      ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
    for(let i=0;i<3;i++){const st=55.6+i*.1; if(t<st)continue;
      const q=Math.min(1,(t-st)/1.35); const R=40+q*q*640+i*230; const a=(1-q)*(.42-.12*i);
      ctx.strokeStyle=`rgba(255,${195-45*i},120,${a})`;ctx.lineWidth=(1-q)*24+1.5;
      ctx.beginPath();ctx.arc(bcx,bcy,R,0,7);ctx.stroke()}
    ctx.restore();
  }
  drawCaptions(t);
  // grain (full-frame repeating pattern, no visible tile edges)
  if(!GRAIN_PAT)GRAIN_PAT=ctx.createPattern(grain[0],'repeat');
  ctx.globalAlpha=.05;ctx.imageSmoothingEnabled=false;
  ctx.save();ctx.translate(Math.random()*160|0,Math.random()*160|0);
  ctx.fillStyle=GRAIN_PAT;ctx.fillRect(-160,-160,W+320,H+320);ctx.restore();
  ctx.imageSmoothingEnabled=true;ctx.globalAlpha=1;
  // occasional scratch
  if(!REDUCED&&Math.random()<.05){ctx.strokeStyle='rgba(255,255,255,.05)';ctx.beginPath();
    const sx=Math.random()*W;ctx.moveTo(sx,0);ctx.lineTo(sx+20,H);ctx.stroke()}
  // vignette
  ctx.drawImage(vigC,0,0);
  // letterbox painted LAST -> grain/scratch/blast never touch the bars (no bar flicker)
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H*.093);ctx.fillRect(0,H*.907,W,H*.093);
}

/* ============ MAIN LOOP / CONTROL ============ */
let playing=false,t0=0,startOffset=0;
function now(){return performance.now()}
function loop(){
  const t=playing?(now()-t0)/1000+startOffset:startOffset;
  TG=t;
  try{draw(t)}catch(e){window.__errs.push('draw:'+e.message)}
  audioFrame(t);
  $tc.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
  $prog.style.width=clamp(t/DUR,0,1)*100+'%';
  if(playing&&t>=64.5)$replay.classList.remove('hidden');
  requestAnimationFrame(loop);
}
function begin(){
  audioInit();
  if(S.ctx){S.ctx.resume();S.master.gain.setTargetAtTime(MUTED?0:.9,S.ctx.currentTime,.4);
    S.droneG.gain.setTargetAtTime(.06,S.ctx.currentTime,1.5)}
  $start.classList.add('hidden');$replay.classList.add('hidden');
  $tc.style.display='block';$prog.style.display='block';
  playing=!STILL;t0=now();
}
function stopAll(){
  playing=false;
  if(S.ctx){S.master.gain.setTargetAtTime(0,S.ctx.currentTime,.2);
    S.droneG.gain.setTargetAtTime(0,S.ctx.currentTime,.3)}
  riserStop();
  $start.classList.remove('hidden');
}
function restart(){
  S.ev=0;S.mu=0;S.bub.next=0;S.tick.next=0;startOffset=0;
  begin();
}
document.getElementById('begin').addEventListener('click',begin);
document.getElementById('again').addEventListener('click',restart);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){stopAll()}});
requestAnimationFrame(loop);
// verification seek mode: ?t=SECONDS auto-starts muted at that time
if(SEEK!==null){startOffset=SEEK;S.ev=EVENTS.length;
  while(S.ev>0&&EVENTS[S.ev-1].t>SEEK)S.ev--;
  S.mu=CUES.length;
  while(S.mu>0&&CUES[S.mu-1].t>SEEK)S.mu--;
  begin()}
</script>
